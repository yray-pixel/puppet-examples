---
- name: restart haproxy
  ansible.builtin.service:
    name: "{{ profile_haproxy_service_name }}"
    state: restarted
  become: true
- name: reload haproxy
  ansible.builtin.service:
    name: "{{ profile_haproxy_service_name }}"
    state: reloaded
  become: true
- name: systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
