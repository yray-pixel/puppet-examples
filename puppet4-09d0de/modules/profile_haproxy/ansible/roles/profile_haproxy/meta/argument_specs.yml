---
argument_specs:
  main:
    short_description: Manages HAProxy load balancer installation, configuration, and service management
    description:
      - Installs and configures HAProxy load balancer
      - Supports SSL termination, statistics page, multiple backend configurations
      - Manages firewall rules and service discovery
    options:
      profile_haproxy_package_name:
        type: str
        required: false
        default: haproxy
        description: Package name for HAProxy
      profile_haproxy_config_dir:
        type: str
        required: false
        default: /etc/haproxy
        description: Directory for HAProxy configuration files
      profile_haproxy_config_file:
        type: str
        required: false
        default: /etc/haproxy/haproxy.cfg
        description: Main HAProxy configuration file path
      profile_haproxy_service_name:
        type: str
        required: false
        default: haproxy
        description: Name of the HAProxy service
      profile_haproxy_user:
        type: str
        required: false
        default: haproxy
        description: User account for HAProxy service
      profile_haproxy_group:
        type: str
        required: false
        default: haproxy
        description: Group for HAProxy service
      profile_haproxy_discovery_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable service discovery
      profile_haproxy_stats_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable the statistics page
      profile_haproxy_stats_port:
        type: int
        required: false
        default: 9000
        description: Port for the statistics page
      profile_haproxy_stats_uri:
        type: str
        required: false
        default: /haproxy-stats
        description: URI path for the statistics page
      profile_haproxy_global_maxconn:
        type: int
        required: false
        default: 4096
        description: Maximum number of concurrent connections
      profile_haproxy_client_timeout:
        type: str
        required: false
        default: 30s
        description: Client timeout setting
      profile_haproxy_server_timeout:
        type: str
        required: false
        default: 30s
        description: Server timeout setting
      profile_haproxy_connect_timeout:
        type: str
        required: false
        default: 5s
        description: Connection timeout setting
      profile_haproxy_retries:
        type: int
        required: false
        default: 3
        description: Number of connection retries
      profile_haproxy_ssl_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable SSL/TLS
      profile_haproxy_ssl_cert_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Path to SSL certificates
      profile_haproxy_ssl_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Path to SSL private keys
      profile_haproxy_ssl_ciphers:
        type: str
        required: false
        default: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
        description: SSL cipher suite configuration
      profile_haproxy_ssl_min_version:
        type: str
        required: false
        default: TLSv1.2
        description: Minimum SSL/TLS version
      profile_haproxy_log_server:
        type: str
        required: false
        default: 127.0.0.1
        description: Syslog server address
      profile_haproxy_log_facility:
        type: str
        required: false
        default: local0
        description: Syslog facility
      profile_haproxy_log_level:
        type: str
        required: false
        default: info
        description: Log level
      profile_haproxy_stick_table_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable stick tables
      profile_haproxy_stick_table_size:
        type: str
        required: false
        default: 100k
        description: Size of stick tables
      profile_haproxy_stick_table_expire:
        type: str
        required: false
        default: 30m
        description: Expiration time for stick table entries
      profile_haproxy_firewall_provider:
        type: str
        required: false
        default: none
        description: Firewall provider (none, firewalld, ufw)
      profile_haproxy_firewall_zone:
        type: str
        required: false
        default: public
        description: Firewall zone for firewalld
      profile_haproxy_extra_packages:
        type: list
        elements: str
        required: false
        default: []
        description: Additional packages to install
      profile_haproxy_selinux_enabled:
        type: bool
        required: false
        default: false
        description: Whether to configure SELinux for HAProxy
      profile_haproxy_backends:
        type: dict
        required: false
        description: Backend server configurations
      stats_user:
        type: str
        required: true
        description: Username for HAProxy statistics page (injected by AAP credential)
      stats_password:
        type: str
        required: true
        description: Password for HAProxy statistics page (injected by AAP credential)
