- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create HAProxy configuration directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/haproxy
    - /tmp/molecule_test/etc/haproxy/conf.d
    - /tmp/molecule_test/etc/haproxy/errors
    - /tmp/molecule_test/var/lib/haproxy
    - /tmp/molecule_test/etc/systemd/system/haproxy.service.d
    - /tmp/molecule_test/etc/logrotate.d
    loop_control:
      loop_var: item_dir
  - name: Create main HAProxy configuration file
    ansible.builtin.copy:
      content: "# Global settings\nglobal\n    log 127.0.0.1 local0 info\n    maxconn 4096\n    user haproxy\n    group haproxy\n    daemon\n    stats socket /var/lib/haproxy/stats\n\n#
        Default settings\ndefaults\n    log global\n    mode http\n    option httplog\n    option dontlognull\n    timeout connect 5s\n    timeout client 30s\n    timeout
        server 30s\n    retries 3\n    errorfile 503 /etc/haproxy/errors/503.http\n    errorfile 408 /etc/haproxy/errors/408.http\n\n# Stats page\nlisten stats\n
        \   bind *:9000\n    stats enable\n    stats uri /haproxy-stats\n    stats realm HAProxy\\ Statistics\n    stats auth admin:password\n\n# Frontend configuration\nfrontend
        http_front\n    bind *:80\n    default_backend webservers\n\n# Include backend configurations\n# Backend configurations are in /etc/haproxy/conf.d/\n"
      dest: /tmp/molecule_test/etc/haproxy/haproxy.cfg
      mode: '0640'
      backup: true
  - name: Create webservers backend configuration
    ansible.builtin.copy:
      content: "# Backend configuration for webservers\nbackend webservers\n    balance roundrobin\n    option httpchk GET /health\n    http-check expect status 200\n
        \   http-check interval 5s\n    server web1 10.0.1.10:8080 check weight 100\n    server web2 10.0.1.11:8080 check weight 100\n    server web3 10.0.1.12:8080
        check weight 100\n"
      dest: /tmp/molecule_test/etc/haproxy/conf.d/webservers.cfg
      mode: '0640'
      backup: true
  - name: Create API backend configuration
    ansible.builtin.copy:
      content: "# Backend configuration for API\nbackend api\n    balance leastconn\n    option httpchk GET /api/health\n    http-check expect status 200\n    http-check
        interval 10s\n    server api1 10.0.2.10:3000 check weight 100\n    server api2 10.0.2.11:3000 check weight 100\n"
      dest: /tmp/molecule_test/etc/haproxy/conf.d/api.cfg
      mode: '0640'
      backup: true
  - name: Create stick tables configuration
    ansible.builtin.copy:
      content: '# Managed by Ansible

        stick-table type ip size 100k expire 30m

        '
      dest: /tmp/molecule_test/etc/haproxy/conf.d/stick-tables.cfg
      mode: '0640'
      backup: true
  - name: Create error pages
    ansible.builtin.copy:
      content: "HTTP/1.0 {{ item.error_code }} {{ item.error_message }}\nCache-Control: no-cache\nConnection: close\nContent-Type: text/html\n\n<html>\n<head>\n  <title>{{
        item.error_code }} {{ item.error_message }}</title>\n</head>\n<body>\n  <h1>{{ item.error_message }}</h1>\n  <p>The server cannot process your request at
        this time.</p>\n</body>\n</html>\n"
      dest: /tmp/molecule_test/etc/haproxy/errors/{{ item.error_code }}.http
      mode: '0644'
      backup: true
    loop:
    - error_code: '503'
      error_message: Service Unavailable
    - error_code: '408'
      error_message: Request Timeout
  - name: Create systemd override file
    ansible.builtin.copy:
      content: '[Service]

        ExecStart=

        ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock

        '
      dest: /tmp/molecule_test/etc/systemd/system/haproxy.service.d/override.conf
      mode: '0644'
      backup: true
  - name: Create logrotate configuration
    ansible.builtin.copy:
      content: "/var/log/haproxy/*.log {\n    daily\n    rotate 14\n    missingok\n    notifempty\n    compress\n    delaycompress\n    sharedscripts\n    postrotate\n
        \       /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true\n    endscript\n}\n"
      dest: /tmp/molecule_test/etc/logrotate.d/haproxy
      mode: '0644'
      backup: true
