---
controller_credentials:
- name: HAProxy Statistics Interface - profile_haproxy
  description: Authentication credentials for HAProxy statistics web interface
  organization: Default
  credential_type: HAProxy Statistics Interface
  update_secrets: true
  inputs:
    stats_user: '{{ stats_user }}'
    stats_password: '{{ vault_stats_password }}'
- name: HAProxy SSL/TLS Certificate - profile_haproxy
  description: SSL/TLS certificate and private key for HAProxy HTTPS termination
  organization: Default
  credential_type: HAProxy SSL/TLS Certificate
  update_secrets: true
  inputs:
    ssl_certificate: '{{ ssl_certificate }}'
    ssl_private_key: '{{ vault_ssl_private_key }}'
