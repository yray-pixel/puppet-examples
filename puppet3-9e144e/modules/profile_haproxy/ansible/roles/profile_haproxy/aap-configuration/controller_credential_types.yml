---
controller_credential_types:
- name: HAProxy Statistics Interface
  description: Authentication credentials for HAProxy statistics web interface
  kind: cloud
  inputs:
    fields:
    - id: stats_user
      type: string
      label: Statistics Username
      help_text: Username for accessing the HAProxy statistics interface
    - id: stats_password
      type: string
      label: Statistics Password
      secret: true
      help_text: Password for accessing the HAProxy statistics interface (encrypted
        with eyaml PKCS7 in Puppet)
    required:
    - stats_user
    - stats_password
  injectors:
    extra_vars:
      stats_user: !unsafe '{{ stats_user }}'
      stats_password: !unsafe '{{ stats_password }}'
- name: HAProxy SSL/TLS Certificate
  description: SSL/TLS certificate and private key for HAProxy HTTPS termination
  kind: cloud
  inputs:
    fields:
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      help_text: PEM-encoded SSL/TLS certificate for HTTPS termination
    - id: ssl_private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: PEM-encoded private key for SSL/TLS certificate (referenced at /etc/ssl/private
        in Puppet)
    required:
    - ssl_certificate
    - ssl_private_key
  injectors:
    extra_vars:
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_private_key: !unsafe '{{ ssl_private_key }}'
