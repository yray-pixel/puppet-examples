---
- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: /usr/sbin/haproxy -c -f {{ profile_haproxy_config_file }}
  register: haproxy_config_validation
  changed_when: false
  failed_when: haproxy_config_validation.rc != 0
- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Deploy systemd override for config validation
  ansible.builtin.copy:
    content: "[Service]\nExecStartPre=/usr/sbin/haproxy -c -f {{ profile_haproxy_config_file }}\nExecReload=/bin/kill -USR2 $MAINPID\n"
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd
- name: Ensure HAProxy service is enabled and started
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
