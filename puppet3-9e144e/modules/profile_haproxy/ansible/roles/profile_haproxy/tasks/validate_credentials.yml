---
- name: Validate required stats credential variables are defined
  ansible.builtin.assert:
    that:
      - stats_user is defined
      - stats_password is defined
    fail_msg: Stats credential variables (stats_user, stats_password) are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
- name: Validate required SSL credential variables are defined
  ansible.builtin.assert:
    that:
      - ssl_certificate is defined
      - ssl_private_key is defined
    fail_msg: SSL credential variables (ssl_certificate, ssl_private_key) are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
  when: profile_haproxy_ssl_enabled
